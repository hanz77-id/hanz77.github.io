<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>hanz77 Official</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f0f23;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
            padding-bottom: 60px;
        }
        .skull {
            font-size: 40px;
            margin: 15px 0;
        }
        h1 {
            color: #d81b60;
            font-size: 60px;
            text-shadow: 0 0 15px #d81b60;
            margin-bottom: 10px;
        }
        .sub {
            color: #4ecdc4;
            font-size: 16px;
            margin: 10px 0 30px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #d81b60;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        #pesan {
            margin-top: 25px;
            font-size: 22px;
            color: #4ecdc4;
        }
    </style>
</head>
<body>
    <div class="skull">💀</div>
    <h1>hanz77</h1>
    <p class="sub">EDITOR • KREATOR • TERMUX</p>
    <button onclick="klikTombol()">Klik Aku!</button>
    <p id="pesan"></p>

    <script>
        function klikTombol() {
            document.getElementById("pesan").innerHTML = "🎉 Keren! Berhasil!";
        }
    </script>
</body>
</html>
